name: Déployer la fiabilité APK et les archives

on:
  workflow_dispatch:
  push:
    branches: [main]
    # This release runs only when its explicit migration manifest changes.
    paths: ['supabase/releases/reliability-20260919.json']

permissions:
  contents: read

concurrency:
  group: supabase-production-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Appliquer uniquement les migrations validées
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-reliability.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer le rapport atomique après la migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy update_message_status --project-ref gamumybcoxxanhjakpde --no-verify-jwt
