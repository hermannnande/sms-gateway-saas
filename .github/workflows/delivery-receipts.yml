name: Préparer la base pour les accusés de réception SMS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-release
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Appliquer uniquement la migration des accusés
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/deploy-reliability.mjs delivery-receipts-20261014.json
